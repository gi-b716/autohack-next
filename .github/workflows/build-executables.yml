name: Build Executables

on:
  workflow_call:
    inputs:
      app-version:
        description: 'Formatted app version'
        required: true
        type: string
      release-name:
        description: 'Release name / tag'
        required: true
        type: string
      commit-hash:
        description: 'Commit hash'
        required: true
        type: string

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: windows-2025
            platform: windows
            arch: x64
          - os: windows-11-arm
            platform: windows
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: Intel
          - os: macos-15
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Configure Python environment
        uses: ./.github/actions/prepare-python-env

      - name: Download changelog
        uses: actions/download-artifact@v8
        with:
          name: changelog

      - name: Setup UPX
        uses: ./.github/actions/install-upx
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}

      - name: Build executable
        run: |
          uv run python -m nuitka --standalone --onefile --follow-imports --enable-plugins=upx --lto=yes --warn-implicit-exceptions --warn-unusual-code --include-data-dir="autohack/assets/i18n"="autohack/assets/i18n" --file-version=${{ inputs.app-version }} --assume-yes-for-downloads autohack/__main__.py

      - name: Create release package (Linux / macOS)
        if: matrix.platform == 'linux' || matrix.platform == 'macos'
        run: |
          mkdir release-package
          cp README.md release-package/
          cp changelog.md release-package/CHANGELOG.md
          cp __main__.bin release-package/autohack
          cp -r docs release-package/
          cd release-package
          zip -r ../autohack-${{ matrix.platform }}-${{ matrix.arch }}-${{ inputs.release-name }}-${{ inputs.commit-hash }}.zip .

      - name: Create release package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          mkdir release-package
          cp README.md release-package/
          cp changelog.md release-package/CHANGELOG.md
          mv __main__.exe autohack.exe
          cp autohack.exe release-package/autohack.exe
          cp -r docs release-package/
          cd release-package
          Compress-Archive -Path * -DestinationPath ../autohack-${{ matrix.platform }}-${{ matrix.arch }}-${{ inputs.release-name }}-${{ inputs.commit-hash }}.zip

      - name: Upload executable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: executable-${{ matrix.platform }}-${{ matrix.arch }}
          path: autohack-${{ matrix.platform }}-${{ matrix.arch }}-${{ inputs.release-name }}-${{ inputs.commit-hash }}.zip
