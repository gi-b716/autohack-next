name: Crowdin Sync

on:
  workflow_dispatch:
    inputs:
      direction:
        description: "Sync direction"
        required: true
        type: choice
        options:
          - upload
          - download
        default: upload
  schedule:
    # Weekly translation pull: Monday 08:00 UTC
    - cron: "0 8 * * 1"

defaults:
  run:
    shell: bash

jobs:
  upload-sources:
    name: Upload sources to Crowdin
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.direction == 'upload'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Upload sources to Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  download-translations:
    name: Download translations from Crowdin
    if: |
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.direction == 'download')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download translations from Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          localization_branch_name: l10n_crowdin
          create_pull_request: true
          pull_request_title: "l10n: new translations from Crowdin"
          pull_request_body: |
            This PR contains the latest translations from Crowdin.

            ### Changes
            - Updated translations from Crowdin
            - Auto-generated by Crowdin Sync workflow
          pull_request_labels: "l10n"
          pull_request_assignees: "gi-b716"
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
